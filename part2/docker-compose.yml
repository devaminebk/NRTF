# =============================================================================
# docker-compose.yml — Re·Tech Fusion
# =============================================================================
# Two services:
#   - pipeline   : runs `python main.py` once, generating data/processed/*.csv
#   - dashboard  : runs `streamlit run ...` and serves http://localhost:8501
#
# How to run:
#     docker compose up --build
#
# Then open http://localhost:8501 in your browser.
#
# To re-run the pipeline only (e.g. after adding new files in data/raw/):
#     docker compose run --rm pipeline
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # 1. Pipeline service — runs once, then exits.
  #    Generates data/processed/energy_consolidated.csv from data/raw/.
  # ---------------------------------------------------------------------------
  pipeline:
    build: .
    image: retech-fusion:latest
    container_name: retech-pipeline
    command: python main.py
    volumes:
      # Mount data folders so the pipeline can read raw inputs and
      # the dashboard can read the resulting CSV.
      - ./data:/app/data
    environment:
      - CO2_FACTOR_KG_PER_KWH=0.468
      - GAS_PCI_KWH_PER_NM3=10.562

  # ---------------------------------------------------------------------------
  # 2. Dashboard service — long-running web server on port 8501.
  #    Waits for the pipeline to finish before starting.
  # ---------------------------------------------------------------------------
  dashboard:
    build: .
    image: retech-fusion:latest
    container_name: retech-dashboard
    command: streamlit run src/dashboard/app.py
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - CO2_FACTOR_KG_PER_KWH=0.468
      - GAS_PCI_KWH_PER_NM3=10.562
    depends_on:
      pipeline:
        condition: service_completed_successfully
    restart: unless-stopped